name: Deploy to ECS (EC2) with GITHUB_SHA tag

on:
  push:
    branches: ['main']
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

  # secrets로 이동
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECS_TASK_EXEC_ROLE_ARN: ${{ secrets.ECS_TASK_EXEC_ROLE_ARN }}

  AWS_ARN_PORT: ${{ secrets.AWS_ARN_PORT }}
  AWS_ARN_DATABASE_URL: ${{ secrets.AWS_ARN_DATABASE_URL }}
  AWS_ARN_ALLOW_ORIGIN: ${{ secrets.AWS_ARN_ALLOW_ORIGIN }}
  AWS_ARN_OPENAI_API_KEY: ${{ secrets.AWS_ARN_OPENAI_API_KEY }}
  AWS_ARN_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ARN_AWS_ACCESS_KEY_ID }}
  AWS_ARN_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ARN_AWS_SECRET_ACCESS_KEY }}
  AWS_ARN_AWS_REGION: ${{ secrets.AWS_ARN_AWS_REGION }}
  AWS_ARN_AWS_S3_BUCKET: ${{ secrets.AWS_ARN_AWS_S3_BUCKET }}
  AWS_ARN_GOOGLE_CLIENT_ID: ${{ secrets.AWS_ARN_GOOGLE_CLIENT_ID }}
  AWS_ARN_GOOGLE_CLIENT_SECRET: ${{ secrets.AWS_ARN_GOOGLE_CLIENT_SECRET }}
  AWS_ARN_NAVER_CLIENT_ID: ${{ secrets.AWS_ARN_NAVER_CLIENT_ID }}
  AWS_ARN_NAVER_CLIENT_SECRET: ${{ secrets.AWS_ARN_NAVER_CLIENT_SECRET }}
  AWS_ARN_ANTHROPIC_API_KEY: ${{ secrets.AWS_ARN_ANTHROPIC_API_KEY }}

  # 비민감 값들은 vars 유지
  ECR_WEB_REPO: ${{ vars.ECR_WEB_REPO }}
  ECR_API_REPO: ${{ vars.ECR_API_REPO }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
  ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}

  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
  NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build & Push web (amd64)
        id: build_web
        run: |
          WEB_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_WEB_REPO}:${GITHUB_SHA}"
          echo "WEB_IMAGE=$WEB_IMAGE" >> $GITHUB_OUTPUT
          docker buildx build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg NEXT_PUBLIC_KAKAO_MAP_API_KEY="${NEXT_PUBLIC_KAKAO_MAP_API_KEY}" \
            -t "$WEB_IMAGE" \
            -f apps/web/Dockerfile \
            . \
            --push

      - name: Build & Push api (amd64)
        id: build_api
        run: |
          API_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_API_REPO}:${GITHUB_SHA}"
          echo "API_IMAGE=$API_IMAGE" >> $GITHUB_OUTPUT
          docker buildx build \
            --platform linux/amd64 \
            -t "$API_IMAGE" \
            -f apps/api/Dockerfile \
            . \
            --push

      - name: Prepare web taskdef (inject executionRoleArn)
        run: |
          jq --arg ROLE_ARN "$ECS_TASK_EXEC_ROLE_ARN" \
            '.executionRoleArn = $ROLE_ARN' \
            infra/ecs/taskdef-web.json > infra/ecs/taskdef-web.rendered.json

      - name: Render web task definition
        id: render_web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/taskdef-web.rendered.json
          container-name: web
          image: ${{ steps.build_web.outputs.WEB_IMAGE }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render_web.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_WEB_SERVICE }}
          wait-for-service-stability: true

      - name: Prepare api taskdef (inject executionRoleArn)
        run: |
          jq \
            --arg ROLE_ARN "$ECS_TASK_EXEC_ROLE_ARN" \
            --arg PORT_ARN "$AWS_ARN_PORT" \
            --arg DATABASE_URL_ARN "$AWS_ARN_DATABASE_URL" \
            --arg ALLOW_ORIGIN_ARN "$AWS_ARN_ALLOW_ORIGIN" \
            --arg OPENAI_API_KEY_ARN "$AWS_ARN_OPENAI_API_KEY" \
            --arg AWS_KEY_ARN "$AWS_ARN_AWS_ACCESS_KEY_ID" \
            --arg AWS_SECERT_KEY_ARN "$AWS_ARN_AWS_SECRET_ACCESS_KEY" \
            --arg AWS_REGION_ARN "$AWS_ARN_AWS_REGION" \
            --arg AWS_S3_ARN "$AWS_ARN_AWS_S3_BUCKET" \
            --arg GOOGLE_ID_ARN "$AWS_ARN_GOOGLE_CLIENT_ID" \
            --arg GOOGLE_SECRET_ARN "$AWS_ARN_GOOGLE_CLIENT_SECRET" \
            --arg NAVER_ID_ARN "$AWS_ARN_NAVER_CLIENT_ID" \
            --arg NAVER_SECRET_ARN "$AWS_ARN_NAVER_CLIENT_SECRET" \
            --arg ANTHROPIC_KEY_ARN "$AWS_ARN_ANTHROPIC_API_KEY" \
            '
            .executionRoleArn = $ROLE_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="PORT") | .valueFrom) = $PORT_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="DATABASE_URL") | .valueFrom) = $DATABASE_URL_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="ALLOW_ORIGIN") | .valueFrom) = $ALLOW_ORIGIN_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="OPENAI_API_KEY") | .valueFrom) = $OPENAI_API_KEY_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="AWS_ACCESS_KEY_ID") | .valueFrom) = $AWS_KEY_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="AWS_SECRET_ACCESS_KEY") | .valueFrom) = $AWS_SECERT_KEY_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="AWS_REGION") | .valueFrom) = $AWS_REGION_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="AWS_S3_BUCKET") | .valueFrom) = $AWS_S3_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="GOOGLE_CLIENT_ID") | .valueFrom) = $GOOGLE_ID_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="GOOGLE_CLIENT_SECRET") | .valueFrom) = $GOOGLE_SECRET_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="NAVER_CLIENT_ID") | .valueFrom) = $NAVER_ID_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="NAVER_CLIENT_SECRET") | .valueFrom) = $NAVER_SECRET_ARN
            | (.containerDefinitions[] | select(.name=="api") | .secrets[] | select(.name=="ANTHROPIC_API_KEY") | .valueFrom) = $ANTHROPIC_KEY_ARN            
            ' \
            infra/ecs/taskdef-api.json > infra/ecs/taskdef-api.rendered.json

      - name: Render api task definition
        id: render_api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/taskdef-api.rendered.json
          container-name: api
          image: ${{ steps.build_api.outputs.API_IMAGE }}

      - name: Deploy api service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render_api.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_API_SERVICE }}
          wait-for-service-stability: true
