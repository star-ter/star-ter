services:
  postgres:
    build:
      context: ./postgres
    container_name: alley-local-postgres
    restart: unless-stopped
    ports:
      - '55433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: alley
    volumes:
      - recovery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d alley']
      interval: 5s
      timeout: 5s
      retries: 5
  valkey:
    image: valkey/valkey-bundle:latest
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6379:6379'
    volumes:
      - 'valkey_data:/bitnami/valkey/data'

volumes:
  recovery_pgdata:
    name: alley_recovery_pgdata
  valkey_data:
